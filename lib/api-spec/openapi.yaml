      tags: [finance]
      summary: List transactions with optional filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_reconciliation, reconciled]
        - name: type
          in: query
          schema:
            type: string
            enum: [revenue, expense]
        - name: categoryId
          in: query
          schema:
            type: number
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancialTransaction"
    post:
      operationId: createFinancialTransaction
      tags: [finance]
      summary: Create a manual transaction (pre-reconciled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialTransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialTransaction"

  /finance/transactions/import:
    post:
      operationId: importFinancialTransactions
      tags: [finance]
      summary: Import transactions from CSV or OFX file (MASTER only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                fileType:
                  type: string
                  enum: [csv, ofx]
      responses:
        "201":
          description: Imported transactions (pending reconciliation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid file format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /finance/transactions/{id}:
    patch:
      operationId: updateFinancialTransaction
      tags: [finance]
      summary: Update a transaction (categorize, edit description, notes)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialTransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialTransaction"
    delete:
      operationId: deleteFinancialTransaction
      tags: [finance]
      summary: Delete a transaction (MASTER only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /finance/transactions/{id}/reconcile:
    post:
      operationId: reconcileTransaction

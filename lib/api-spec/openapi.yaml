  /team/performance:
    get:
      operationId: getTeamPerformance
      tags: [team]
      summary: Get team performance summary for a given month
      parameters:
        - name: year
          in: query
          schema:
            type: number
        - name: month
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Performance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPerformanceSummary"

  /team/capacity:

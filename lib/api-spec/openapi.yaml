components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ─── USER ─────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, email, role, createdAt, hasPassword]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: ["string", "null"]
        role:
          type: string
          enum: [MASTER, COLLABORATOR, CLIENT]
        isActive:
          type: boolean
        hasPassword:
          type: boolean
          description: Whether the user has a local password set (in addition to or instead of Google OAuth)
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: ["string", "null"]
          format: date-time

    SetPasswordInput:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          description: Required when the user already has a password set
        newPassword:
          type: string
          minLength: 8

    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: ["string", "null"]
        role:
          type: string
          enum: [MASTER, COLLABORATOR, CLIENT]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [MASTER, COLLABORATOR, CLIENT]
        isActive:
          type: boolean

    UsersSummary:
      type: object
      required: [total, masters, collaborators, clients]
      properties:
        total:
          type: number
        masters:
          type: number
        collaborators:
          type: number
        clients:
          type: number

    # ─── PERMISSIONS ──────────────────────────────────────────────────────────
    PermissionEntry:
      type: object
      required: [id, userId, module, level]
      properties:
        id:
          type: number
        userId:
          type: number
        userName:
          type: ["string", "null"]
        module:
          type: string
          enum:
            - dashboard
            - finance
            - students
            - files
            - commercial
            - team
            - calendar
        level:
          type: string
          enum: [NONE, READ, WRITE]

    PermissionInput:
      type: object
      required: [level]
      properties:
        level:
          type: string
          enum: [NONE, READ, WRITE]

    # ─── ACTIVITY LOG ─────────────────────────────────────────────────────────
    ActivityEntry:
      type: object
      required: [id, action, entityType, createdAt]
      properties:
        id:
          type: number
        userId:
          type: ["number", "null"]
        userName:
          type: ["string", "null"]
        userAvatarUrl:
          type: ["string", "null"]
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: ["number", "null"]
        entityLabel:
          type: ["string", "null"]
        metadata:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ─── PLANS ────────────────────────────────────────────────────────────────
    Plan:
      type: object
      required: [id, name, stageCount]
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        stageCount:
          type: number

    # ─── STUDENTS ─────────────────────────────────────────────────────────────
    StudentSummary:
      type: object
      required: [id, fullName, planId, planName, currentStageIndex, totalStages, sessionCount, lastSessionAt, openTaskCount, trailStatus, isActive, createdAt]
      properties:
        id:
          type: number
        userId:
          type: ["number", "null"]
        fullName:
          type: string
        email:
          type: ["string", "null"]
        planId:
          type: number
        planName:
          type: string
        currentStageIndex:
          type: number
        totalStages:
          type: number
        nextSessionAt:
          type: ["string", "null"]
          format: date-time
        sessionCount:
          type: number
        lastSessionAt:
          type: ["string", "null"]
          format: date-time
        openTaskCount:
          type: number
        trailStatus:
          type: string
          enum: [on_track, delayed, ahead]
        startDate:
          type: ["string", "null"]
        planEndsAt:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    StudentDetail:
      type: object
      required: [id, fullName, planId, planName, currentStageIndex, totalStages, sessionCount, lastSessionAt, openTaskCount, trailStatus, isActive, createdAt]
      properties:
        id:
          type: number
        userId:
          type: ["number", "null"]
        fullName:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        planId:
          type: number
        planName:
          type: string
        currentStageIndex:
          type: number
        totalStages:
          type: number
        nextSessionAt:
          type: ["string", "null"]
          format: date-time
        sessionCount:
          type: number
        lastSessionAt:
          type: ["string", "null"]
          format: date-time
        openTaskCount:
          type: number
        trailStatus:
          type: string
          enum: [on_track, delayed, ahead]
        startDate:
          type: ["string", "null"]
        planEndsAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StudentInput:
      type: object
      required: [fullName, planId]
      properties:
        fullName:
          type: string
        userId:
          type: ["number", "null"]
        planId:
          type: number
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        planEndsAt:
          type: ["string", "null"]
        nextSessionAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    StudentUpdate:
      type: object
      properties:
        fullName:
          type: string
        userId:
          type: ["number", "null"]
        planId:
          type: number
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        planEndsAt:
          type: ["string", "null"]
        nextSessionAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean

    # ─── TRAIL STAGES ─────────────────────────────────────────────────────────
    TrailStage:
      type: object
      required: [id, studentId, stageIndex, title, status]
      properties:
        id:
          type: number
        studentId:
          type: number
        stageIndex:
          type: number
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, in_progress, complete, delayed]
        dueDate:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
          format: date-time

    TrailStageUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, in_progress, complete, delayed]
        dueDate:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]

    # ─── SESSIONS ─────────────────────────────────────────────────────────────
    Session:
      type: object
      required: [id, studentId, sessionNumber, createdAt]
      properties:
        id:
          type: number
        studentId:
          type: number
        sessionNumber:
          type: number
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        conductedAt:
          type: ["string", "null"]
          format: date-time
        summary:
          type: ["string", "null"]
        actionPlan:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    SessionInput:
      type: object
      properties:
        scheduledAt:
          type: ["string", "null"]
        conductedAt:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        actionPlan:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    SessionUpdate:
      type: object
      properties:
        scheduledAt:
          type: ["string", "null"]
        conductedAt:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        actionPlan:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    # ─── STUDENT TASKS ────────────────────────────────────────────────────────
    StudentTask:
      type: object
      required: [id, studentId, title, createdAt]
      properties:
        id:
          type: number
        studentId:
          type: number
        title:
          type: string
        description:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CROAS OS — Sistema de Gestão 360 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: permissions
    description: Permission management
  - name: activity
    description: Activity log
  - name: plans
    description: Mentoring plans
  - name: students
    description: Student management
  - name: portal
    description: Client self-service portal
  - name: Storage
    description: Object storage upload and serving endpoints
  - name: commercial
    description: Commercial CRM — leads, pipeline, goals, analytics
  - name: finance
    description: Financial module — transactions, reconciliation, DRE, receivables, goals
  - name: team
    description: Team module — tasks, goals, performance
  - name: dashboard
    description: Dashboard 360 — aggregated KPI snapshot for MASTER

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────────────────────────────
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password:
    patch:
      operationId: setPassword
      tags: [auth]
      summary: Set or change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordInput"
      responses:
        "200":
          description: Password updated — returns the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated or current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── USERS ──────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [MASTER, COLLABORATOR, CLIENT]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (admin use / seed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/summary:
    get:
      operationId: getUsersSummary
      tags: [users]
      summary: Count users by role
      responses:
        "200":
          description: Summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersSummary"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (role, name, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── PERMISSIONS ────────────────────────────────────────────────────────────
  /permissions/matrix:
    get:
      operationId: getPermissionsMatrix
      tags: [permissions]
      summary: Get full permissions matrix (all users × all modules)
      responses:
        "200":
          description: Full matrix
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionEntry"

  /permissions/{userId}/{module}:
    put:
      operationId: setPermission
      tags: [permissions]
      summary: Set permission level for a user+module cell
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: number
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum:
              - dashboard
              - finance
              - students
              - files
              - commercial
              - team
              - calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionInput"
      responses:
        "200":
          description: Updated permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionEntry"

  # ─── ACTIVITY LOG ───────────────────────────────────────────────────────────
  /activity:
    get:
      operationId: listActivityLog
      tags: [activity]
      summary: List activity log entries
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 50
        - name: userId
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Activity log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"

  # ─── PLANS ──────────────────────────────────────────────────────────────────
  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List available mentoring plans
      responses:
        "200":
          description: Available plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  # ─── STUDENTS ───────────────────────────────────────────────────────────────
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students (MASTER / COLLABORATOR with students access)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: planId
          in: query
          schema:
            type: number
        - name: trailStatus
          in: query
          schema:
            type: string
            enum: [on_track, delayed, ahead]
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of students with summary info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentSummary"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a new student record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get student detail (dossier)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Student detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── TRAIL STAGES ───────────────────────────────────────────────────────────
  /students/{studentId}/stages:
    get:
      operationId: listStudentStages
      tags: [students]
      summary: List all trail stages for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Trail stages ordered by stageIndex
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrailStage"

  /students/{studentId}/stages/{stageIndex}:
    patch:
      operationId: updateStudentStage
      tags: [students]
      summary: Update a trail stage (status, dueDate, etc.)
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
        - name: stageIndex
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrailStageUpdate"
      responses:
        "200":
          description: Updated stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrailStage"

  # ─── SESSIONS ───────────────────────────────────────────────────────────────
  /students/{studentId}/sessions:
    get:
      operationId: listStudentSessions
      tags: [students]
      summary: List sessions for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Sessions ordered by sessionNumber desc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createStudentSession
      tags: [students]
      summary: Create a session for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /students/{studentId}/sessions/{sessionId}:
    patch:
      operationId: updateStudentSession
      tags: [students]
      summary: Update a session (add notes, action plan, mark conducted)
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
        - name: sessionId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    delete:
      operationId: deleteStudentSession
      tags: [students]
      summary: Delete a session
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
        - name: sessionId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── TASKS ──────────────────────────────────────────────────────────────────
  /students/{studentId}/tasks:
    get:
      operationId: listStudentTasks
      tags: [students]
      summary: List tasks assigned to a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
        - name: completed
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentTask"
    post:
      operationId: createStudentTask
      tags: [students]
      summary: Assign a task to a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentTaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentTask"

  /students/{studentId}/tasks/{taskId}:
    patch:
      operationId: updateStudentTask
      tags: [students]
      summary: Update a task (mark complete, change due date, etc.)
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
        - name: taskId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentTaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentTask"
    delete:
      operationId: deleteStudentTask
      tags: [students]
      summary: Delete a task
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
        - name: taskId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── FORM RESPONSES ─────────────────────────────────────────────────────────
  /students/{studentId}/forms:
    get:
      operationId: listStudentForms
      tags: [students]
      summary: List form responses for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
        - name: formType
          in: query
          schema:
            type: string
            enum: [anamnese, objectives, smart_goals]
      responses:
        "200":
          description: Form responses ordered by respondedAt desc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FormResponse"
    post:
      operationId: createStudentForm
      tags: [students]
      summary: Add a form response for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormResponseInput"
      responses:
        "201":
          description: Created form response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormResponse"

  # ─── FILES ──────────────────────────────────────────────────────────────────
  /students/{studentId}/files:
    get:
      operationId: listStudentFiles
      tags: [students]
      summary: List uploaded files for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
        - name: fileType
          in: query
          schema:
            type: string
            enum: [contract, transcript, mindmap, other]
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentFile"
    post:
      operationId: registerStudentFile
      tags: [students]
      summary: Register a file after GCS upload (stores metadata in DB)
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentFileInput"
      responses:
        "201":
          description: File registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentFile"

  /students/{studentId}/files/{fileId}:
    delete:
      operationId: deleteStudentFile
      tags: [students]
      summary: Delete a file record (and optionally purge from storage)
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
        - name: fileId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── COMMERCIAL — LEADS ──────────────────────────────────────────────────────
  /leads:
    get:
      operationId: listLeads
      tags: [commercial]
      summary: List leads with optional filters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            type: string
            enum: [lead, call_agendada, call_realizada, proposta, fechado, perdido]
        - name: origin
          in: query
          schema:
            type: string
            enum: [instagram, indicacao, parceria, palestra, outro]
        - name: assignedToId
          in: query
          schema:
            type: number
        - name: followUpToday
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [commercial]
      summary: Create a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [commercial]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLead
      tags: [commercial]
      summary: Update a lead (name, notes, next follow-up, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [commercial]
      summary: Delete a lead (MASTER only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /leads/{id}/move-stage:
    post:
      operationId: moveLeadStage
      tags: [commercial]
      summary: Move a lead to a new pipeline stage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveStageInput"
      responses:
        "200":
          description: Updated lead with new stage (if stage=fechado, convertedStudentId is populated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid stage transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── COMMERCIAL — GOALS ───────────────────────────────────────────────────────
  /commercial/goals/{year}/{month}:
    get:
      operationId: getCommercialGoal
      tags: [commercial]
      summary: Get the monthly commercial goal
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: number
        - name: month
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Monthly goal (null if not set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialGoal"
    put:
      operationId: setCommercialGoal
      tags: [commercial]
      summary: Create or update the monthly commercial goal
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: number
        - name: month
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommercialGoalInput"
      responses:
        "200":
          description: Upserted goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialGoal"

  # ─── COMMERCIAL — ANALYTICS ───────────────────────────────────────────────────
  /commercial/analytics/funnel:
    get:
      operationId: getConversionFunnel
      tags: [commercial]
      summary: Conversion funnel — count and rate per stage
      parameters:
        - name: year
          in: query
          schema:
            type: number
        - name: month
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Funnel data per stage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FunnelStageData"

  /commercial/analytics/by-origin:
    get:
      operationId: getConversionByOrigin
      tags: [commercial]
      summary: Lead count and conversion rate per origin channel
      parameters:
        - name: year
          in: query
          schema:
            type: number
        - name: month
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Data per origin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OriginData"

  # ─── FINANCE — CATEGORIES ────────────────────────────────────────────────────
  /finance/categories:
    get:
      operationId: listFinancialCategories
      tags: [finance]
      summary: List all financial categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancialCategory"
    post:
      operationId: createFinancialCategory
      tags: [finance]
      summary: Create a financial category (MASTER only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialCategory"

  /finance/categories/{id}:
    patch:
      operationId: updateFinancialCategory
      tags: [finance]
      summary: Update a financial category (MASTER only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialCategoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialCategory"
    delete:
      operationId: deleteFinancialCategory
      tags: [finance]
      summary: Delete a financial category (MASTER only)
      parameters:
        - name: id
          in: path
